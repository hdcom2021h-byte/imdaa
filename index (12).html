<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إمضاء — التوقيع الإلكتروني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://dsubdshqlzadefhqisnd.supabase.co" crossorigin>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style id="pageStyle">@page{size:A4;margin:12mm}</style>
<style>
:root{--pri:#5b3a8c;--pri-d:#3f2466;--pri-l:#f1ecf8;--pri-m:#ddd0ee;--bg:#f5f3f8;--card:#fff;--line:#e8e4ea;--tx:#2c2430;--mut:#786f7d;--ok:#3d8b68;--ok-l:#e6f3ec;--wr:#b9822b;--wr-l:#fbf2e2;--dg:#b14c4c;--dg-l:#f9e9e9;--r:14px;--sh:0 1px 2px rgba(40,20,40,.04),0 4px 14px rgba(40,20,40,.05)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri-d)}
h1,h2,h3,h4{line-height:1.35}
.mut{color:var(--mut)} .c{text-align:center} .req{color:var(--dg)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap;text-decoration:none;color:var(--tx)}
.btn:hover{border-color:var(--pri-m);background:var(--pri-l)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{filter:brightness(.95)}
.btn.dg{color:var(--dg);border-color:#efd3d3}
.btn.dg:hover{background:var(--dg-l)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ic{padding:7px}
.btn.big{width:100%;justify-content:center;padding:13px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;outline:none;transition:.15s}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.in:disabled{background:#f8f7f9;color:#6d6472}
textarea.in{resize:vertical;min-height:90px;line-height:1.9}
label.lb{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:0 0 5px}
.fld{margin-bottom:14px}
.hint{font-size:12.5px;color:var(--mut);margin-top:5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .mut{font-size:13px;font-weight:500}
.note{border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.note.wr{background:var(--wr-l);color:#7d5717}
.note.ok{background:var(--ok-l);color:#28644a}
.note.in2{background:var(--pri-l);color:var(--pri-d)}
.err{color:var(--dg);font-size:14px;min-height:20px;margin:6px 0}
svg.i{flex-shrink:0}
/* shell */
.shell{display:flex;min-height:100vh}
.side{width:255px;background:#fff;border-left:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;flex-shrink:0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand img,.brand .lg{width:44px;height:44px;border-radius:12px;object-fit:contain;background:var(--pri-l);display:grid;place-items:center;color:var(--pri-d);flex-shrink:0}
.brand b{display:block;font-size:14.5px;line-height:1.35}
.brand small{color:var(--mut);font-size:11.5px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--tx);text-decoration:none;font-weight:600;font-size:14.5px;margin-bottom:2px}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--pri-l);color:var(--pri-d)}
.nav .cnt{margin-inline-start:auto;background:var(--bg);border-radius:20px;padding:0 8px;font-size:12px;color:var(--mut)}
.nav a.on .cnt{background:#fff}
.nav .sec{font-size:12px;color:var(--mut);padding:12px 12px 4px;font-weight:700}
.ubox{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:8px;font-size:13px}
.ubox div{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .acts{margin-inline-start:auto;display:flex;gap:8px}
.content{padding:22px 24px 48px;max-width:1300px;width:100%}
.menuBtn{display:none!important}
.scrim{display:none}
/* dashboard */
.welcome{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--pri),var(--pri-d));color:#fff;border-radius:18px;padding:20px 22px;margin-bottom:18px;flex-wrap:wrap}
.welcome img{width:62px;height:62px;border-radius:14px;background:#fff;object-fit:contain;padding:4px}
.welcome h2{margin:0;font-size:20px}
.welcome p{margin:2px 0 0;opacity:.9;font-size:14px}
.welcome .dt{margin-inline-start:auto;text-align:left;font-size:13px;opacity:.95}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh)}
.kpi .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--pri-l);color:var(--pri-d);flex-shrink:0}
.kpi b{font-size:24px;display:block;line-height:1.1}
.kpi span{color:var(--mut);font-size:13px}
.sec-t{font-size:16px;margin:6px 0 12px;display:flex;align-items:center;gap:8px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:20px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border-top:4px solid var(--c);display:flex;flex-direction:column;gap:10px}
.tcard .hd{display:flex;align-items:center;gap:10px}
.tcard .hd .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.tcard .hd b{font-size:16px}
.tcard .nums{display:flex;gap:14px;font-size:13px;color:var(--mut)}
.tcard .nums strong{color:var(--tx);font-size:15px}
.tcard .ft{display:flex;gap:6px;margin-top:auto}
.bar{height:7px;background:#efedf0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}
.prg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);min-width:140px}
.prg .bar{flex:1}
.bdg{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.bdg.draft{background:#eef0f2;color:#5f6670}.bdg.open{background:var(--ok-l);color:var(--ok)}.bdg.closed{background:var(--wr-l);color:var(--wr)}
.bdg.active{background:var(--ok-l);color:var(--ok)}.bdg.pending{background:var(--wr-l);color:var(--wr)}.bdg.suspended{background:var(--dg-l);color:var(--dg)}
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:right;color:var(--mut);font-weight:700;font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfafb;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#fcfbfc}
.tbl a.tl{font-weight:700;text-decoration:none;color:var(--tx)}
.tbl a.tl:hover{color:var(--pri-d)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.empty svg{opacity:.5}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .in{max-width:280px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;padding:5px 12px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:700}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
/* document page */
.docgrid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}
.sidecol{position:sticky;top:76px}
.att{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:#fcfbfc}
.att .k{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--pri-l);color:var(--pri-d);flex-shrink:0;overflow:hidden}
.att .k img{width:100%;height:100%;object-fit:cover}
.att .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.att .nm small{display:block;color:var(--mut);font-size:12px}
.save-ind{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:5px}
.save-ind.ok{color:var(--ok)} .save-ind.err{color:var(--dg)}
.stbox{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ringw{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),#efedf0 0);flex-shrink:0}
.ring div{width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:21px;font-weight:800}
.ringw .lg2 div{font-size:14px;margin-bottom:3px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:8px}
.tab{padding:8px 12px;cursor:pointer;font-weight:700;color:var(--mut);border-bottom:2px solid transparent;font-size:14px;background:none;border-top:0;border-left:0;border-right:0}
.tab.on{color:var(--pri-d);border-bottom-color:var(--pri)}
.plist{max-height:330px;overflow:auto}
.pitem{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:14px}
.pitem:last-child{border-bottom:0}
.pitem .nm{flex:1;min-width:0}
.pitem .nm small{display:block;color:var(--mut);font-size:12px}
.pitem img{height:28px;max-width:70px;object-fit:contain}
.linkbox{display:flex;gap:6px}
.linkbox .in{font-size:12.5px;direction:ltr;text-align:left}
.qr{display:flex;justify-content:center;margin:12px 0 4px}
.qr img{width:150px;height:150px;image-rendering:pixelated;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff}
.chkl{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px;margin-top:8px}
.chkl label{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer;font-size:14px}
.chkl label:last-child{border-bottom:0}
.chkl small{color:var(--mut);margin-inline-start:auto}
.opt{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;padding:4px 0}
.opt input{accent-color:var(--pri);width:17px;height:17px}
input[type=checkbox]{accent-color:var(--pri)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);margin-top:10px}
/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(30,20,30,.42);display:grid;place-items:center;z-index:60;padding:16px;animation:fd .15s}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal.wide{max-width:860px}
.modal h3{margin:0 0 14px;font-size:18px}
.modal .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
@keyframes fd{from{opacity:0}to{opacity:1}}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:#2c2430;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:fd .2s}
.tst.err{background:var(--dg)} .tst.ok{background:var(--ok)}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 20%,#efe4ee 0,transparent 40%),radial-gradient(circle at 85% 80%,#e9e2ef 0,transparent 40%),var(--bg)}
.auth-box{display:grid;grid-template-columns:1fr 1.1fr;max-width:940px;width:100%;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(60,30,60,.12)}
.auth-side{background:linear-gradient(160deg,#5b3a8c,#2f1a52);color:#fff;padding:38px 34px}
.auth-side .lgb{width:62px;height:62px;border-radius:16px;background:rgba(255,255,255,.16);display:grid;place-items:center;margin-bottom:16px}
.auth-side h2{margin:0;font-size:30px}
.auth-side p{margin:4px 0 22px;opacity:.9}
.auth-side ul{list-style:none;padding:0;margin:0}
.auth-side li{display:flex;gap:8px;align-items:center;margin-bottom:11px;font-size:14.5px}
.auth-form{padding:34px}
.atabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:20px}
.atabs a{flex:1;text-align:center;padding:9px 4px;border-radius:9px;text-decoration:none;color:var(--mut);font-weight:700;font-size:13.5px;white-space:nowrap}
.typepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.typepick button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;color:var(--tx)}
.typepick button:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,#fff)}
.typepick button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.typepick button span{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.nav .newdoc{width:100%;justify-content:center;margin:2px 0 8px}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.sumrow div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sumrow b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.sumrow span{color:var(--mut);font-size:13px}
.atabs a.on{background:#fff;color:var(--pri-d);box-shadow:var(--sh)}
.center-card{max-width:520px;margin:12vh auto;padding:0 16px}
/* public signing page */
.pub{max-width:840px;margin:0 auto;padding:18px 14px 40px}
.paper{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--sh)}
.pfoot{text-align:center;color:var(--mut);font-size:12.5px;margin-top:14px}
.ohead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--pri);margin-bottom:18px}
.ohead .r{font-weight:700;font-size:13.5px;line-height:1.85}
.ohead .cc img{height:84px;max-width:150px;object-fit:contain;display:block}
.ohead .l{text-align:left;font-size:13px;line-height:1.9}
.ptitle{text-align:center;margin-bottom:16px}
.ptitle h1{font-size:22px;margin:8px 0 4px}
.tbdg{display:inline-flex;align-items:center;gap:5px;padding:3px 12px;border-radius:20px;font-size:13px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.pbody{white-space:pre-wrap;line-height:2.05;font-size:16px;margin-bottom:18px}
.ph{color:var(--mut);border-bottom:1px dashed var(--mut)}
.atts{border-top:1px solid var(--line);padding-top:14px;margin-bottom:16px}
.atts h4{margin:0 0 10px;font-size:15px}
.attimg{max-width:100%;max-height:360px;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:6px}
.psign{text-align:left;margin:18px 0 6px;line-height:1.9}
.psign div{color:var(--mut);font-size:14px}
.signbox{background:#fbf9fb;border:1px solid var(--pri-m);border-radius:16px;padding:18px;margin-top:20px}
.signbox h3{margin:0 0 6px;display:flex;gap:8px;align-items:center}
.ack{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:14px 0;cursor:pointer;font-weight:600}
.ack input{width:20px;height:20px;margin-top:3px;flex-shrink:0}
.padwrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:14px}
#pad{width:100%;height:170px;border:1.5px dashed var(--pri-m);border-radius:10px;touch-action:none;background:#fff;display:block;margin-top:8px;cursor:crosshair}
.done{text-align:center;color:var(--ok)}
.done h3{justify-content:center;font-size:20px;margin:6px 0}
.done p{color:var(--tx);margin:0 0 14px}
.done svg{background:var(--ok-l);border-radius:50%;padding:12px}
.hdrprev{border:1px dashed var(--pri-m);border-radius:12px;padding:16px;background:#fff}
.hdrprev .ohead{margin-bottom:0}
.logo-up{display:flex;align-items:center;gap:12px}
.logo-up .lp{width:84px;height:84px;border-radius:12px;border:1px dashed var(--pri-m);display:grid;place-items:center;background:#fff;overflow:hidden;color:var(--mut);font-size:12px}
.logo-up .lp img{width:100%;height:100%;object-fit:contain}
.theme-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.theme-row input[type=color]{width:46px;height:38px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#fff;cursor:pointer}
.swatches{display:flex;gap:4px}.swatches i{width:22px;height:22px;border-radius:6px;display:block;border:1px solid rgba(0,0,0,.08)}
/* print */
#printArea{display:none}
.landing{min-height:100vh;background:#f3f0f6;display:flex;flex-direction:column;align-items:center;justify-content:center}
.land-img{position:relative;width:min(100%,calc(100vh * 1672 / 941));line-height:0}
.land-img img{width:100%;height:auto;display:block}
.land-all{display:block;cursor:pointer}
.hot{position:absolute;top:3.2%;height:5.3%;border-radius:40px;transition:box-shadow .15s}
.hot:hover,.hot:focus-visible{box-shadow:0 0 0 3px rgba(91,58,140,.45);outline:none}
.hot-login{left:8.1%;width:11.4%}
.hot-reg{left:20.3%;width:10.7%}
.land-bar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));width:100%;background:#f3f0f6}
.land-bar .btn{width:auto;min-width:220px}
@media(max-width:700px){.hot{top:1%;height:10%}}
[hidden]{display:none!important}
.pdoc{font-family:'Tajawal',sans-serif;color:#000;font-size:13px}
.pdoc .ohead{border-bottom-color:var(--pri-d)}
.pdoc h2{text-align:center;margin:6px 0 12px;font-size:19px}
.pdoc table{width:100%;border-collapse:collapse}
.pdoc th,.pdoc td{border:1px solid #9a909c;padding:5px 6px;text-align:center;font-size:12px}
.pdoc th{background:var(--pri-l)}
.pdoc td img{height:42px;max-width:130px;object-fit:contain;display:block;margin:0 auto}
.pdoc .meta td{text-align:right}
.pdoc .meta th{width:18%}
.pdoc .body{white-space:pre-wrap;line-height:2;font-size:15px}
.pdoc .foot{display:flex;justify-content:space-between;margin-top:22px;font-size:13px}
.pdoc .nos{color:#999}
.cert{border:7px double var(--pri);padding:9mm 12mm;min-height:178mm;display:flex;flex-direction:column;font-family:'Tajawal',sans-serif;color:#1d1620}
.cert .ohead{border-bottom-color:#c9b6c6}
.cert-t{text-align:center;font-size:32px;font-weight:800;color:var(--pri-d);margin:14px 0 10px}
.cert-b{font-size:19px;line-height:2.15;text-align:center;white-space:pre-wrap;flex:1}
.cert-f{display:flex;justify-content:space-between;align-items:flex-end;margin-top:20px;font-size:14px;line-height:1.9}
@media (max-width:1100px){.docgrid{grid-template-columns:1fr}.sidecol{position:static}}
@media (max-width:900px){
 .side{position:fixed;right:0;top:0;z-index:40;transform:translateX(105%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.15)}
 .shell.open .side{transform:none}
 .shell.open .scrim{display:block;position:fixed;inset:0;background:rgba(30,20,30,.35);z-index:35}
 .menuBtn{display:inline-flex!important}
 .content{padding:16px}.top{padding:10px 16px}
 .grid2,.grid3{grid-template-columns:1fr}
 .auth-box{grid-template-columns:1fr}.auth-side{padding:26px}.auth-side ul{display:none}.auth-form{padding:24px}
 .welcome .dt{margin-inline-start:0;text-align:right}
 .toolbar .in{max-width:none;flex:1 1 100%}
}
@media (max-width:560px){
 .paper{padding:16px}
 .ohead{grid-template-columns:1fr auto;}
 .ohead .l{grid-column:1/-1;text-align:right;border-top:1px dashed var(--line);padding-top:6px}
 .ohead .cc img{height:64px}
 .top h1{font-size:16px}
}
@media print{
 body{background:#fff}
 body.printing>*:not(#printArea){display:none!important}
 body.printing #printArea{display:block}
 .pdoc th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .cert{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

const DEFAULT_THEME = '#5b3a8c';
function hexToHsl(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if(!m) return null;
  const n = parseInt(m[1], 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; let hh = 0, s = 0;
  if(mx !== mn){ const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    hh = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; hh *= 60; }
  return { h: hh, s, l };
}
function hslToHex(h, s, l){
  s = Math.max(0, Math.min(1, s)); l = Math.max(0, Math.min(1, l));
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))))).toString(16).padStart(2, '0');
  return '#' + f(0) + f(8) + f(4);
}
function themePalette(hex){
  const c = hexToHsl(hex) || hexToHsl(DEFAULT_THEME);
  const s = Math.max(c.s, .35), L = Math.min(Math.max(c.l, .28), .44);
  return { pri: hslToHex(c.h, s, L), d: hslToHex(c.h, s, L - .11), l: hslToHex(c.h, Math.min(s, .55), .955), m: hslToHex(c.h, Math.min(s, .45), .86) };
}
function applyTheme(hex){
  const r = document.documentElement.style;
  if(!hex){ ['--pri','--pri-d','--pri-l','--pri-m'].forEach(v => r.removeProperty(v)); return; }
  const p = themePalette(hex);
  r.setProperty('--pri', p.pri); r.setProperty('--pri-d', p.d); r.setProperty('--pri-l', p.l); r.setProperty('--pri-m', p.m);
}
/* يستخرج اللون الغالب (غير الأبيض والرمادي) من صورة الشعار */
function colorFromImage(src){
  return new Promise(res => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      try{
        const c = document.createElement('canvas'), N = 72; c.width = N; c.height = N;
        const x = c.getContext('2d'); x.drawImage(img, 0, 0, N, N);
        const d = x.getImageData(0, 0, N, N).data, bins = {};
        for(let i = 0; i < d.length; i += 4){
          if(d[i + 3] < 140) continue;
          const hex = '#' + [d[i], d[i + 1], d[i + 2]].map(v => v.toString(16).padStart(2, '0')).join('');
          const t = hexToHsl(hex); if(!t || t.s < .22 || t.l > .9 || t.l < .08) continue;
          const key = Math.round(t.h / 12) + ':' + Math.round(t.l * 5);
          const bn = bins[key] || (bins[key] = { w: 0, c: 0, r: 0, g: 0, b: 0 });
          bn.w += 1 + t.s; bn.c++; bn.r += d[i]; bn.g += d[i + 1]; bn.b += d[i + 2];
        }
        const best = Object.values(bins).sort((p, q) => q.w - p.w)[0];
        if(!best || best.c < 15) return res(null);
        res('#' + [best.r, best.g, best.b].map(v => Math.round(v / best.c).toString(16).padStart(2, '0')).join(''));
      }catch(e){ res(null); }
    };
    img.onerror = () => res(null);
    img.src = src;
  });
}

function smsHref(phones, body){
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && 'ontouchend' in document);
  const b = encodeURIComponent(body);
  if(phones.length === 1) return ios ? `sms:${phones[0]}&body=${b}` : `sms:${phones[0]}?body=${b}`;
  return ios ? `sms:/open?addresses=${phones.join(',')}&body=${b}` : `sms:${phones.join(',')}?body=${b}`;
}

/* ---------- لوحة التوقيع اليدوي ---------- */
function setupPad(c){
  const ctx = c.getContext('2d'); let drawing = false, empty = true, last = null;
  const r = c.getBoundingClientRect(); const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineWidth = 2.3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d1630';
  const pos = e => { const b = c.getBoundingClientRect(); return {x:e.clientX - b.left, y:e.clientY - b.top}; };
  c.addEventListener('pointerdown', e => { drawing = true; last = pos(e); try{ c.setPointerCapture(e.pointerId); }catch(_){} e.preventDefault(); });
  c.addEventListener('pointermove', e => { if(!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; empty = false; e.preventDefault(); });
  const up = () => { drawing = false; }; c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up); c.addEventListener('pointerleave', up);
  return { isEmpty: () => empty, clear: () => { ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0, 0, c.width, c.height); ctx.restore(); empty = true; }, data: () => c.toDataURL('image/png') };
}

function pubWrap(inner){ return `<div class="pub"><div class="paper">${inner}</div><div class="pfoot">${PLATFORM_NAME} — ${PLATFORM_SUB}</div></div>`; }
async function renderSign(token){
  stopRefresh(); app.onclick = null; app.oninput = null; app.onchange = null;
  document.title = PLATFORM_NAME + ' — توقيع مستند';
  app.innerHTML = pubWrap(`<div class="empty">جاري تحميل المستند…</div>`);
  const { data: doc, error } = await sb.rpc('imdaa_public_doc', { p_token: token });
  if(error || !doc){
    app.innerHTML = pubWrap(`<div class="empty">${icon('file', 44)}<h2>الرابط غير متاح</h2><p>قد يكون الرابط غير صحيح أو لم يُنشر المستند بعد. تواصلي مع إدارة المدرسة.</p></div>`);
    return;
  }
  doc.doc_type = doc.type;
  const st = (doc.school && doc.school.settings) || {};
  applyTheme(st.theme_color || null);
  const T = TYPES[doc.type] || TYPES.other;
  const isCert = doc.type === 'certificate' || doc.type === 'thanks';
  const expired = doc.deadline && todayISO() > doc.deadline;
  const canSign = doc.status === 'open' && !expired;
  let signer = null, pad = null, busy = false;

  const signBox = () => {
    if(!signer) return `<h3>${icon('shield')} التحقق من الهوية</h3><p class="mut" style="margin:0 0 10px">أدخلي رقم السجل المدني للاطلاع والتوقيع الإلكتروني.</p>
      <form id="vf" class="row"><input class="in" id="nid" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="رقم السجل المدني (10 أرقام)" style="flex:1;min-width:200px;direction:ltr;text-align:center;font-size:17px;letter-spacing:2px"><button class="btn pri">تحقق</button></form>
      ${!canSign ? `<div class="note wr" style="margin-top:12px">${doc.status !== 'open' ? 'تم إغلاق التوقيع على هذا المستند.' : 'انتهت مهلة التوقيع على هذا المستند.'}</div>` : ''}`;
    if(signer.signed) return `<div class="done">${icon('check', 56)}<h3>تم التوقيع والاعتماد</h3><p>${esc(signer.name)} — ${fmtDT(signer.signed_at)}</p>
      <div class="row" style="justify-content:center"><button class="btn pri" id="pPrint">${icon('printer')} ${isCert ? 'طباعة ' + (doc.type === 'certificate' ? 'الشهادة' : 'خطاب الشكر') : 'طباعة نسخة'}</button></div></div>`;
    if(!canSign) return `<h3>مرحباً، ${esc(signer.name)}</h3><div class="note wr" style="margin-top:10px">${doc.status !== 'open' ? 'تم إغلاق التوقيع على هذا المستند.' : 'انتهت مهلة التوقيع على هذا المستند.'}</div>`;
    return `<h3>مرحباً، ${esc(signer.name)}</h3>${signer.job ? `<div class="mut">${esc(signer.job)}</div>` : ''}
      <label class="ack"><input type="checkbox" id="ack"> <span>اطلعتُ على ما ورد في ${typeObj(doc)} وأُقرّ بذلك، وأعتمد توقيعي الإلكتروني عليه.</span></label>
      <div class="padwrap"><div class="row" style="justify-content:space-between"><b>التوقيع ${doc.require_drawn ? '<span class="req">*</span>' : '<span class="mut" style="font-weight:500">(اختياري)</span>'}</b><button type="button" class="btn sm" id="padClr">مسح</button></div><canvas id="pad"></canvas></div>
      <button class="btn ok big" id="signBtn">${icon('check')} توقيع واعتماد</button>`;
  };
  const paint = () => {
    app.innerHTML = pubWrap(`${headerHTML(st, {ref:doc.ref_no, date:doc.doc_date})}
      <div class="ptitle"><span class="tbdg" style="--c:${T.color}">${icon(T.icon, 15)} ${esc(typeLabel(doc))}</span><h1>${esc(doc.title)}</h1>${doc.deadline ? `<div class="mut" style="font-size:13.5px">${icon('clock', 14)} آخر موعد للتوقيع: ${fmtDate(doc.deadline)}</div>` : ''}</div>
      <div class="pbody">${bodyHTML(doc.body, signer && signer.name)}</div>
      ${attsHTML(doc.attachments)}
      ${principalHTML(st)}
      <div class="signbox" id="signbox">${signBox()}</div>`);
    const vf = $('#vf');
    if(vf) vf.onsubmit = async e => {
      e.preventDefault(); if(busy) return;
      const nid = onlyDigits($('#nid').value);
      if(nid.length !== 10) return toast('رقم السجل المدني يجب أن يكون 10 أرقام', 'err');
      busy = true;
      const { data, error } = await sb.rpc('imdaa_public_verify', { p_token: token, p_nid: nid });
      busy = false;
      if(error) return toast(errMsg(error), 'err');
      if(!data || !data.ok) return toast((data && data.reason) || 'تعذر التحقق', 'err');
      signer = { ...data, nid }; paint();
      $('#signbox').scrollIntoView({behavior:'smooth', block:'start'});
    };
    const c = $('#pad'); if(c) pad = setupPad(c);
    const clr = $('#padClr'); if(clr) clr.onclick = () => pad && pad.clear();
    const sbtn = $('#signBtn');
    if(sbtn) sbtn.onclick = async () => {
      if(busy) return;
      if(!$('#ack').checked) return toast('يرجى تأكيد الاطلاع والإقرار أولاً', 'err');
      if(doc.require_drawn && pad.isEmpty()) return toast('يرجى رسم التوقيع', 'err');
      busy = true; sbtn.disabled = true; sbtn.textContent = 'جاري الاعتماد…';
      const { data, error } = await sb.rpc('imdaa_public_sign', { p_token: token, p_nid: signer.nid, p_sig: pad && !pad.isEmpty() ? pad.data() : null, p_ua: navigator.userAgent });
      busy = false;
      if(error || !data || !data.ok){ sbtn.disabled = false; sbtn.innerHTML = icon('check') + ' توقيع واعتماد'; return toast(error ? errMsg(error) : (data && data.reason) || 'تعذر التوقيع', 'err'); }
      signer.signed = true; signer.signed_at = data.signed_at; paint(); toast('تم التوقيع والاعتماد بنجاح', 'ok');
    };
    const pp = $('#pPrint');
    if(pp) pp.onclick = () => isCert ? printCertificate(doc, st, signer.name, signer.signed_at) : printDocument(doc, st, signer);
  };
  paint();
}

/* =================== الدخول والتسجيل =================== */
async function loadAccount(user){
  S.user = user; S.role = null; S.school = null;
  const [{ data: own }, { data: sch, error: schErr }] = await Promise.all([
    sb.rpc('imdaa_is_owner'),
    sb.from('imdaa_schools').select('*').eq('user_id', user.id).maybeSingle()
  ]);
  if(own){ S.role = 'owner'; return; }
  if(schErr){ S.role = 'error'; S.loadError = errMsg(schErr) + (schErr.code ? ` (${schErr.code})` : ''); return; }
  if(!sch){ S.role = 'noschool'; return; }
  sch.settings = sch.settings || {};
  S.school = sch; S.role = sch.status === 'active' ? 'school' : sch.status;
  if(S.role === 'school') await loadSchoolData();
}
async function loadSchoolData(){
  const [e, d] = await Promise.all([
    sb.from('imdaa_employees').select('*').order('name'),
    sb.from('imdaa_documents').select('*').order('created_at', { ascending: false }),
    loadStats()
  ]);
  S.employees = e.data || []; S.docs = (d.data || []).map(x => ({ ...x, attachments: x.attachments || [], recipients: x.recipients || [] }));
}
async function loadStats(){
  const { data, error } = await sb.rpc('imdaa_school_doc_stats');
  if(error) return;
  S.stats = {}; (data || []).forEach(r => { S.stats[r.document_id] = Number(r.signed); });
  S.statsAt = Date.now();
}
/* الإحصاءات: تُعرض الصفحة فوراً من آخر نسخة، ثم تُحدَّث في الخلفية */
async function statsForPage(rerender){
  if(!S.statsAt) return loadStats();
  if(Date.now() - S.statsAt < 15000) return;
  const before = JSON.stringify(S.stats), h0 = location.hash;
  loadStats().then(() => { if(location.hash === h0 && JSON.stringify(S.stats) !== before && !$('#modalRoot').children.length) rerender(); });
}
async function logout(){
  if(S.flush) S.flush();
  await sb.auth.signOut({ scope: 'local' });
  Object.assign(S, { user:null, role:null, school:null, employees:[], docs:[], stats:{}, statsAt:0 });
  go('#/');
}

    sb.rpc('imdaa_owner_exists').then(({ data, error }) => {

      if(!S.ownerExists && !S.user && (location.hash.split('/')[1] || '') === 'owner') renderAuth('owner');
    });
  }
  const feats = ['رابط توقيع لكل تعميم وخطاب ونشرة وشكر واجتماع وشهادة','توقيع الموظفات بالسجل المدني دون حسابات','إرسال الرابط للجميع برسائل الجوال أو واتساب','لوحة متابعة وسجل للتوقيعات والمستندات المنتظرة','طباعة سجل التوقيعات بترويسة المدرسة وشعارها','إرفاق شواهد متعددة: روابط وملفات PDF وصور'];
  const btnLabel = mode === 'login' ? 'دخول' : mode === 'register' ? 'إرسال طلب التسجيل' : (ownerExists ? 'دخول المالك' : 'إنشاء حساب المالك');
  app.innerHTML = `<div class="auth"><div class="auth-box">
    <div class="auth-side"><div class="lgb">${icon('award', 32)}</div><h2>${PLATFORM_NAME}</h2><p>${PLATFORM_SUB} للمدارس</p><ul>${feats.map(f => `<li>${icon('check', 16)} ${f}</li>`).join('')}</ul></div>
    <div class="auth-form">
      <div class="atabs"><a href="#/login" class="${mode === 'login' ? 'on' : ''}">تسجيل الدخول</a><a href="#/register" class="${mode === 'register' ? 'on' : ''}">تسجيل مدرسة جديدة</a><a href="#/owner" class="${mode === 'owner' ? 'on' : ''}">حساب المالك</a></div>
      ${mode === 'register' ? `<div class="note in2">${icon('shield', 16)} بعد التسجيل يصل الطلب لمالك المنصة ليعتمد حساب المدرسة.</div>` : ''}
      ${mode === 'owner' && !ownerExists ? `<div class="note in2">${icon('shield', 16)} لا يوجد مالك للمنصة بعد. أنشئي حساب المالك الآن، ويُنشأ مرة واحدة فقط.</div>` : ''}
      ${window.DEMO_MODE && window.demoHint ? demoHint(mode) : ''}
      <form id="af" novalidate>${authFields(mode, ownerExists)}<div class="err" id="aerr"></div>
      <button class="btn pri big" id="asub">${btnLabel}</button></form>
      ${mode === 'login' ? `<p class="hint c">نسيتِ كلمة المرور؟ تواصلي مع مالك المنصة لإعادة تعيينها.</p>` : ''}
      <p class="c" style="margin:6px 0 0"><a href="#/" class="hint">← العودة إلى الواجهة</a></p>
    </div></div></div>`;
  const err = m => { $('#aerr').textContent = m; const b = $('#asub'); b.disabled = false; };
  $('#af').onsubmit = async e => {
    e.preventDefault(); $('#aerr').textContent = ''; const btn = $('#asub'); btn.disabled = true;
    const f = Object.fromEntries(new FormData(e.target));
    try{
      if(mode === 'login'){
        const mno = onlyDigits(f.ident);
        if(!mno || !f.pass) return err('أدخلي الرقم الوزاري وكلمة المرور');
        const { data, error } = await sb.auth.signInWithPassword({ email: schoolEmail(mno), password: f.pass });
        if(error) return err(/Invalid login/i.test(error.message) ? 'الرقم الوزاري أو كلمة المرور غير صحيحة' : errMsg(error));
        await loadAccount(data.user); go('#/');
      } else if(mode === 'register'){
        const v = validateSchool(f); if(v) return err(v);
        if(f.pass.length < 8) return err('كلمة المرور 8 أحرف على الأقل');
        if(f.pass !== f.pass2) return err('كلمتا المرور غير متطابقتين');
        const mno = onlyDigits(f.mno);
        const { data: avail } = await sb.rpc('imdaa_ministry_no_available', { p_ministry_no: mno });
        if(avail === false) return err('الرقم الوزاري مسجل مسبقاً في المنصة');
        let r = await sb.auth.signUp({ email: schoolEmail(mno), password: f.pass, options: { data: { full_name: f.admin.trim() } } });
        if(r.error && /already/i.test(r.error.message)) r = await sb.auth.signInWithPassword({ email: schoolEmail(mno), password: f.pass });
        if(r.error) return err(errMsg(r.error));
        if(!r.data.session) return err('خيار تأكيد البريد (Confirm email) مفعّل في Supabase؛ عطّليه ثم أعيدي التسجيل.');
        const { error: re } = await sb.rpc('imdaa_register_school', { p_name: f.name.trim(), p_ministry_no: mno, p_admin_name: f.admin.trim(), p_admin_nid: onlyDigits(f.nid) });
        if(re) return err(errMsg(re));
        await loadAccount(r.data.user); go('#/');
      } else {
        const user = String(f.user || '').trim().toLowerCase();
        if(!/^[a-z0-9._-]{3,30}$/.test(user)) return err('اسم المستخدم بالأحرف الإنجليزية أو الأرقام (3 أحرف على الأقل)');
        if(!f.pass) return err('أدخلي كلمة المرور');
        let r;
        if(ownerExists){
          r = await sb.auth.signInWithPassword({ email: ownerEmail(user), password: f.pass });
          if(r.error) return err(/Invalid login/i.test(r.error.message) ? 'اسم المستخدم أو كلمة المرور غير صحيحة' : errMsg(r.error));
          const { data: own } = await sb.rpc('imdaa_is_owner');
          if(!own){ await sb.auth.signOut(); return err('هذا الحساب ليس حساب المالك'); }
        } else {
          if(f.pass.length < 8) return err('كلمة المرور 8 أحرف على الأقل');
          if(f.pass !== f.pass2) return err('كلمتا المرور غير متطابقتين');
          r = await sb.auth.signUp({ email: ownerEmail(user), password: f.pass });
          if(r.error && /already/i.test(r.error.message)) r = await sb.auth.signInWithPassword({ email: ownerEmail(user), password: f.pass });
          if(r.error) return err(errMsg(r.error));
          if(!r.data.session) return err('عطّلي خيار Confirm email في Supabase ثم أعيدي المحاولة.');
          const { data: ok, error: ce } = await sb.rpc('imdaa_claim_owner');
          if(ce) return err(errMsg(ce));
          if(!ok) return err('يوجد مالك للمنصة مسبقاً');
          S.ownerExists = true;
        }
        await loadAccount(r.data.user); go('#/');
      }
    }catch(ex){ err(errMsg(ex)); }
  };
  if(window.DEMO_MODE && window.demoAuthHook) demoAuthHook(mode);
}

function nextRefNo(type){
  const yr = todayISO().slice(0, 4);
  const nums = S.docs.filter(d => d.doc_type === type && String(d.doc_date || '').startsWith(yr)).map(d => parseInt(onlyDigits(String(d.ref_no || '').split('/')[0]), 10)).filter(n => n > 0);
  return String((nums.length ? Math.max(...nums) : 0) + 1);
}
async function deleteDoc(doc, sigCount){
  if(!await confirmBox(`حذف «${esc(doc.title || 'بدون عنوان')}» نهائياً${sigCount ? ` مع ${sigCount} توقيع` : ''}؟ لا يمكن التراجع.`, 'حذف نهائي', true)) return false;
  const { error } = await sb.from('imdaa_documents').delete().eq('id', doc.id);
  if(error){ toast(errMsg(error), 'err'); return false; }
  const paths = (doc.attachments || []).filter(a => a.path).map(a => a.path); if(paths.length) sb.storage.from(BUCKET).remove(paths);
  S.docs = S.docs.filter(d => d.id !== doc.id); delete S.stats[doc.id]; toast('تم حذف المستند', 'ok'); return true;
}
async function newDoc(type, custom){
  if(type === 'other' && !custom) return chooseTypeModal('other');
  const T = TYPES[type] || TYPES.other;
  const { data, error } = await sb.from('imdaa_documents').insert({ school_id: S.school.id, doc_type: type, custom_type: type === 'other' ? custom : null, title: '', body: T.body || '', doc_date: todayISO(), ref_no: nextRefNo(type), require_drawn: true }).select().single();
  if(error) return toast(errMsg(error), 'err');
  data.attachments = data.attachments || []; data.recipients = data.recipients || [];
  S.docs.unshift(data); go('#/d/' + data.id);
}

      <td><a class="tl" href="#" data-act="view" data-id="${d.id}">${esc(d.title || 'بدون عنوان')}</a>${(d.attachments || []).length ? ` <span class="mut" title="شواهد">${icon('clip', 13)}${d.attachments.length}</span>` : ''}</td>
      ${T.party ? `<td>${esc(d.party || '—')}</td>` : ''}<td><span class="bdg ${d.status}">${stLabel(d.status)}</span></td><td>${progCell(d)}</td>
      <td><div class="row" style="flex-wrap:nowrap">

        <button class="btn sm dg" data-act="del" data-id="${d.id}" title="حذف">${icon('trash', 14)}</button>
      </div></td></tr>`).join('')}
    </tbody></table></div><p class="hint">عدد القيود: ${list.length}</p>`;

      const ws = XLSX.utils.json_to_sheet(rowsX); const wb = XLSX.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] }; XLSX.utils.book_append_sheet(wb, ws, 'الفهرس');
      XLSX.writeFile(wb, `فهرس-${T.plural}.xlsx`);

  app.oninput = e => { if(e.target.id === 'q'){ ui.q = e.target.value.trim(); $('#rows').innerHTML = rows(); } };

async function fetchSigs(id){
  const { data } = await sb.from('imdaa_signatures').select('*').eq('document_id', id).order('signed_at');
  return data || [];
}
function setSaveInd(s){
  const el = $('#saveInd'); if(!el) return;
  el.className = 'save-ind ' + (s === 'ok' ? 'ok' : s === 'err' ? 'err' : '');
  el.innerHTML = s === 'saving' ? 'جاري الحفظ…' : s === 'err' ? 'تعذر الحفظ' : icon('check', 14) + ' تم الحفظ تلقائياً ' + new Date().toLocaleTimeString('ar-SA-u-nu-latn', {hour:'2-digit', minute:'2-digit', timeZone:TZ});
}
async function saveDoc(doc){
  clearTimeout(S.timers.save); S.timers.save = null; S.flush = null;
  const payload = { party: (doc.party || '').trim() || null, doc_type: doc.doc_type, custom_type: doc.doc_type === 'other' ? (doc.custom_type || null) : null, title: doc.title || '', ref_no: doc.ref_no || null, doc_date: doc.doc_date || null, deadline: doc.deadline || null, body: doc.body || '', attachments: doc.attachments || [], audience: doc.audience, recipients: doc.recipients || [], require_drawn: !!doc.require_drawn, status: doc.status };
  const { error } = await sb.from('imdaa_documents').update(payload).eq('id', doc.id);
  if(error){ setSaveInd('err'); toast(errMsg(error), 'err'); return false; }
  setSaveInd('ok'); return true;
}
function scheduleSave(doc){
  setSaveInd('saving'); clearTimeout(S.timers.save);
  S.flush = () => saveDoc(doc);
  S.timers.save = setTimeout(() => saveDoc(doc), 700);
}

    doc = data; S.docs.unshift(doc);

  doc.attachments = doc.attachments || []; doc.recipients = doc.recipients || [];

      </div>
      <div class="card"><h3>${icon('clip')} الشواهد والمرفقات <span class="mut">اختياري — يمكن إضافة أكثر من شاهد</span></h3>
        <div id="attList">${attListHTML()}</div>
        ${L ? '' : `<div class="row"><button class="btn sm" data-act="addLink">${icon('link', 15)} رابط إلكتروني</button><button class="btn sm" data-act="addPdf">${icon('file', 15)} ملف PDF</button><button class="btn sm" data-act="addImg">${icon('image', 15)} صورة</button><span class="hint">الحد الأقصى للملف ${MAX_FILE_MB} ميجابايت</span></div>
        <input type="file" id="fPdf" accept="application/pdf" multiple hidden><input type="file" id="fImg" accept="image/*" multiple hidden>`}
      </div>
      <div class="card"><h3>${icon('users')} الموجَّه إليهن</h3><div id="audBox">${audHTML()}</div></div>
    </div>
    <div class="sidecol">
      <div class="card"><div class="stbox"><span class="bdg ${doc.status}">${stLabel(doc.status)}</span><span class="save-ind ok" id="saveInd">${icon('check', 14)} محفوظ تلقائياً</span></div>${statusBtns}</div>
      ${doc.status !== 'draft' ? `<div class="card"><h3>${icon('link')} رابط التوقيع</h3>
        ${doc.status === 'open' ? `<button class="btn ok big" data-act="send" style="margin-bottom:10px">${icon('msg')} إرسال للجميع برسائل الجوال</button>` : ''}
        <div class="linkbox"><input class="in" readonly value="${esc(signLink(doc))}" onclick="this.select()"><button class="btn" data-act="copyLink">نسخ</button></div>
        <div class="row" style="margin-top:8px"><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(waText())}">${icon('send', 14)} مشاركة واتساب</a><button class="btn sm" data-act="copyMsg">نسخ رسالة كاملة</button><a class="btn sm" href="${esc(signLink(doc))}" target="_blank" rel="noopener">معاينة</a></div>
        <div class="qr"><img id="qrImg" src="${qrURL()}" alt="QR"></div><div class="c"><button class="btn sm" data-act="qrDl">${icon('download', 14)} تحميل رمز QR</button></div></div>`
        : `<div class="card"><div class="note in2" style="margin:0">${icon('link', 16)} انشري المستند لتفعيل رابط التوقيع ورمز QR وإرساله للموظفات.</div></div>`}
      <div class="card" id="progCard">${progHTML()}</div>
      <div class="card"><h3>${icon('printer')} الطباعة والتصدير</h3>
        <label class="opt" style="font-size:14px"><input type="checkbox" id="withUn" ${ui.withUn ? 'checked' : ''}> تضمين غير الموقّعات في السجل</label>
        <div class="row" style="margin-top:8px"><button class="btn sm pri" data-act="printLog">${icon('printer', 14)} سجل التوقيعات</button><button class="btn sm" data-act="printDoc">${icon('file', 14)} طباعة المستند</button><button class="btn sm" data-act="xls">${icon('download', 14)} Excel</button></div>
        <div class="sw"><span class="mut" style="font-size:13px">حذف المستند وجميع توقيعاته</span><button class="btn sm dg" data-act="del">${icon('trash', 14)} حذف</button></div></div>
    </div></div>`;
    shell(doc.doc_type, `${TL}: ${esc(doc.title || 'بدون عنوان')}`, body, `<a class="btn" href="#/t/${doc.doc_type}">رجوع إلى ${T.plural}</a>`);
    bindActs(acts);
    app.oninput = onInput; app.onchange = onChange;
  };

  const uploadFiles = async (files, kind) => {
    for(const f of files){
      if(f.size > MAX_FILE_MB * 1048576){ toast(`الملف «${f.name}» أكبر من ${MAX_FILE_MB} ميجابايت`, 'err'); continue; }
      if(kind === 'pdf' && f.type !== 'application/pdf'){ toast(`«${f.name}» ليس ملف PDF`, 'err'); continue; }
      if(kind === 'image' && !f.type.startsWith('image/')){ toast(`«${f.name}» ليس صورة`, 'err'); continue; }
      const ext = ((f.name.split('.').pop() || '').toLowerCase().replace(/[^a-z0-9]/g, '')) || (kind === 'pdf' ? 'pdf' : 'jpg');
      const path = `${S.school.id}/${doc.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      toast('جاري رفع «' + f.name + '»…');
      const { error } = await sb.storage.from(BUCKET).upload(path, f, { contentType: f.type, upsert: false });
      if(error){ toast(errMsg(error), 'err'); continue; }
      const url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
      doc.attachments.push({ kind, name: f.name, url, path });
      $('#attList').innerHTML = attListHTML();
    }
    setSaveInd('saving'); await saveDoc(doc);
  };
  const onInput = e => {
    const t = e.target;
    if(t.dataset.f){
      const f = t.dataset.f; let v = t.value;
      if(f === 'doc_date' || f === 'deadline') v = v || null;
      doc[f] = v;
      if(f === 'title' || f === 'custom_type') $('#pageTitle').textContent = `${typeLabel(doc)}: ${doc.title || 'بدون عنوان'}`;
      scheduleSave(doc);
    } else if(t.id === 'audQ'){ ui.q = t.value.trim(); $('#audList').innerHTML = audListHTML(); }
  };
  const onChange = e => {
    const t = e.target;
    if(t.id === 'tSel'){
      const v = t.value; doc.doc_type = v; if(v !== 'other') doc.custom_type = null;
      if(!(doc.body || '').trim() && TYPES[v].body) doc.body = TYPES[v].body;
      scheduleSave(doc); paint(); if(v === 'other') $('#ctField').focus(); return;
    }
    if(t.name === 'aud'){ doc.audience = t.value; $('#audBox').innerHTML = audHTML(); $('#progCard').innerHTML = progHTML(); scheduleSave(doc); }
    else if(t.dataset.emp){
      const set = new Set(doc.recipients); t.checked ? set.add(t.dataset.emp) : set.delete(t.dataset.emp);
      doc.recipients = [...set]; $('#audCnt').textContent = 'المحددات: ' + doc.recipients.length; $('#progCard').innerHTML = progHTML(); scheduleSave(doc);
    }
    else if(t.id === 'reqDraw'){ doc.require_drawn = t.checked; scheduleSave(doc); }
    else if(t.id === 'withUn'){ ui.withUn = t.checked; }
    else if(t.id === 'fPdf' || t.id === 'fImg'){ const files = [...t.files]; t.value = ''; if(files.length) uploadFiles(files, t.id === 'fPdf' ? 'pdf' : 'image'); }
  };
  const acts = {
    addLink: () => {
      const m = modal(`<h3>${icon('link')} إضافة رابط إلكتروني</h3><div class="fld"><label class="lb">الرابط</label><input class="in" id="lu" placeholder="https://" style="direction:ltr"></div><div class="fld"><label class="lb">اسم الشاهد (اختياري)</label><input class="in" id="ln"></div><div class="acts"><button class="btn pri" id="lok">إضافة</button><button class="btn" id="lc">إلغاء</button></div>`);
      m.querySelector('#lu').focus();
      m.querySelector('#lc').onclick = () => m.remove();
      m.querySelector('#lok').onclick = async () => {
        let u = m.querySelector('#lu').value.trim(); if(u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
        try{ new URL(u); }catch(_){ return toast('الرابط غير صحيح', 'err'); }
        doc.attachments.push({ kind: 'link', name: m.querySelector('#ln').value.trim() || u, url: u });
        m.remove(); $('#attList').innerHTML = attListHTML(); setSaveInd('saving'); await saveDoc(doc);
      };
    },
    addPdf: () => $('#fPdf').click(),
    addImg: () => $('#fImg').click(),
    rmAtt: async el => {
      const i = +el.dataset.i; const a = doc.attachments[i]; if(!a) return;
      if(!await confirmBox(`حذف الشاهد «${esc(a.name || '')}»؟`, 'حذف', true)) return;
      doc.attachments.splice(i, 1); $('#attList').innerHTML = attListHTML(); setSaveInd('saving'); await saveDoc(doc);
      if(a.path) sb.storage.from(BUCKET).remove([a.path]);
    },
    publish: async () => {
      if(!(doc.title || '').trim()) return toast('أدخلي عنوان المستند قبل النشر', 'err');
      if(doc.doc_type === 'other' && !(doc.custom_type || '').trim()) return toast('اكتبي اسم نوع المستند', 'err');
      if(doc.audience === 'selected' && !doc.recipients.length) return toast('حدّدي الموظفات المستهدفات', 'err');
      if(!eligibleEmps(doc).length) return toast('لا توجد موظفات مستهدفات — أضيفي الموظفات أولاً', 'err');
      doc.status = 'open'; if(!await saveDoc(doc)){ doc.status = 'draft'; return; }
      paint();
      const m = modal(`<h3 style="color:var(--ok)">${icon('check')} تم النشر وتفعيل رابط التوقيع</h3><p>أرسلي الرابط للموظفات المستهدفات (${eligibleEmps(doc).length}):</p>
        <div class="linkbox"><input class="in" readonly value="${esc(signLink(doc))}"><button class="btn" id="mc">نسخ</button></div>
        <div class="acts"><button class="btn ok" id="ms">${icon('msg')} إرسال للجميع برسائل الجوال</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(waText())}">${icon('send')} مشاركة عبر واتساب</a><button class="btn" id="mx">إغلاق</button></div>`);
      m.querySelector('#ms').onclick = () => { m.remove(); openSendModal(doc, sigs); };
      m.querySelector('#mc').onclick = () => copyText(signLink(doc), 'تم نسخ رابط التوقيع');
      m.querySelector('#mx').onclick = () => m.remove();
    },
    close: async () => { if(!await confirmBox('إغلاق التوقيع على هذا المستند؟ لن تتمكن الموظفات من التوقيع بعد الإغلاق.', 'إغلاق')) return; doc.status = 'closed'; await saveDoc(doc); paint(); },
    reopen: async () => { doc.status = 'open'; await saveDoc(doc); paint(); toast('تمت إعادة فتح التوقيع', 'ok'); },
    draft: async () => { doc.status = 'draft'; await saveDoc(doc); paint(); },
    send: () => openSendModal(doc, sigs),
    copyLink: () => copyText(signLink(doc), 'تم نسخ رابط التوقيع'),
    copyMsg: () => copyText(waText(), 'تم نسخ الرسالة'),
    qrDl: () => { const a = document.createElement('a'); a.href = $('#qrImg').src; a.download = `QR-${doc.title || 'document'}.gif`; a.click(); },
    tab: el => { ui.tab = el.dataset.t; $('#progCard').innerHTML = progHTML(); },
    refresh: async () => { sigs = await fetchSigs(doc.id); S.stats[doc.id] = sigs.length; $('#progCard').innerHTML = progHTML(); toast('تم التحديث'); },
    selAll: () => { const set = new Set(doc.recipients); $$('#audList [data-emp]').forEach(c => { c.checked = true; set.add(c.dataset.emp); }); doc.recipients = [...set]; $('#audCnt').textContent = 'المحددات: ' + doc.recipients.length; $('#progCard').innerHTML = progHTML(); scheduleSave(doc); },
    selNone: () => { doc.recipients = []; $$('#audList [data-emp]').forEach(c => c.checked = false); $('#audCnt').textContent = 'المحددات: 0'; $('#progCard').innerHTML = progHTML(); scheduleSave(doc); },
    printLog: () => printLog(doc, sigs, ui.withUn),
    printDoc: () => (doc.doc_type === 'certificate' || doc.doc_type === 'thanks') && /\{الاسم\}/.test(doc.body || '') ? printCertificate(doc, settings(), null, null) : printDocument(doc, settings(), null),
    xls: async () => {
      try{ await needXLSX(); }catch(e){ return toast(e.message, 'err'); }
      const elig = eligibleEmps(doc); const sIds = new Set(sigs.map(s => s.employee_id));
      const rows = sigs.map((s, i) => ({ 'م': i + 1, 'الاسم': s.signer_name, 'السجل المدني': s.signer_national_id, 'الوظيفة': s.signer_job || '', 'الحالة': 'وقّعت', 'تاريخ ووقت التوقيع': fmtDT(s.signed_at) }));
      elig.filter(e => !sIds.has(e.id)).forEach(e => rows.push({ 'م': rows.length + 1, 'الاسم': e.name, 'السجل المدني': e.national_id, 'الوظيفة': e.job_title || '', 'الحالة': 'لم توقّع', 'تاريخ ووقت التوقيع': '' }));
      const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = [{wch:5},{wch:30},{wch:14},{wch:18},{wch:10},{wch:22}];
      const wb = XLSX.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] }; XLSX.utils.book_append_sheet(wb, ws, 'التوقيعات');
      XLSX.writeFile(wb, `سجل-توقيعات-${(doc.title || 'مستند').slice(0, 40)}.xlsx`);
    },
    del: async () => {
      clearTimeout(S.timers.save); S.flush = null;
      if(await deleteDoc(doc, sigs.length)) go('#/t/' + doc.doc_type);
    }
  };
  paint();
  S.refresh = setInterval(async () => {
    if(doc.status !== 'open' || document.visibilityState !== 'visible' || !$('#progCard')) return;
    const n = await fetchSigs(doc.id);
    if(n.length !== sigs.length){
      const wasUnlocked = !locked(); sigs = n; S.stats[doc.id] = n.length;
      if(wasUnlocked && locked()){ if(S.flush) await S.flush(); paint(); } else $('#progCard').innerHTML = progHTML();
    }
  }, 20000);
}

/* =================== بانتظار التوقيع =================== */
async function renderPending(){
  await statsForPage(renderPending);
  const ui = { t: 'all', q: '' };
  const all = () => S.docs.filter(d => d.status === 'open').map(d => ({ d, a: S.stats[d.id] || 0, b: docEligibleCount(d) })).filter(x => x.a < x.b);
  const rowsHTML = () => {
    let l = all();
    if(ui.t !== 'all') l = l.filter(x => x.d.doc_type === ui.t);
    if(ui.q) l = l.filter(x => (x.d.title + ' ' + (x.d.ref_no || '') + ' ' + typeLabel(x.d)).includes(ui.q));
    l.sort((x, y) => (x.d.deadline || '9999') .localeCompare(y.d.deadline || '9999') || pct(x.a, x.b) - pct(y.a, y.b));
    if(!l.length) return `<div class="card empty">${icon('check', 40)}<p>${ui.t === 'all' && !ui.q ? 'لا توجد مستندات بانتظار التوقيع — اكتمل توقيع جميع المستندات المفتوحة.' : 'لا نتائج مطابقة.'}</p></div>`;
    const today = todayISO();
    return `<div class="tbl-w"><table class="tbl"><thead><tr><th>العنوان</th><th>النوع</th><th>التاريخ</th><th>آخر موعد</th><th>التقدم</th><th>المتبقيات</th><th></th></tr></thead><tbody>
      ${l.map(({ d, a, b }) => `<tr><td><a class="tl" href="#/d/${d.id}">${esc(d.title || 'بدون عنوان')}</a></td><td>${esc(typeLabel(d))}</td><td>${fmtDate(d.doc_date)}</td>
        <td>${d.deadline ? `<span class="bdg ${d.deadline < today ? 'suspended' : d.deadline === today ? 'pending' : 'draft'}">${fmtDate(d.deadline)}${d.deadline < today ? ' — انتهت' : d.deadline === today ? ' — اليوم' : ''}</span>` : '—'}</td>
        <td>${progCell(d)}</td><td><b>${b - a}</b></td>
        <td><div class="row" style="flex-wrap:nowrap"><button class="btn sm ok" data-act="send" data-id="${d.id}">${icon('msg', 14)} إرسال</button><button class="btn sm" data-act="copy" data-id="${d.id}">${icon('link', 14)}</button><a class="btn sm" href="#/d/${d.id}">فتح</a></div></td></tr>`).join('')}
    </tbody></table></div>`;
  };
  const l0 = all(); const rem = l0.reduce((s, x) => s + x.b - x.a, 0);
  const types = [...new Set(l0.map(x => x.d.doc_type))];
  const body = `<div class="sumrow"><div><b>${l0.length}</b><span>مستند بانتظار التوقيع</span></div><div><b>${rem}</b><span>توقيع متبقٍّ</span></div><div><b>${l0.filter(x => x.d.deadline && x.d.deadline < todayISO()).length}</b><span>تجاوز آخر موعد</span></div></div>
    <div class="toolbar"><input class="in" id="q" placeholder="بحث بالعنوان أو النوع"><div class="chips"><button class="chip on" data-act="f" data-f="all">الكل</button>${types.map(k => `<button class="chip" data-act="f" data-f="${k}">${TYPES[k] ? TYPES[k].plural : k}</button>`).join('')}</div></div>
    <div id="rows">${rowsHTML()}</div>`;
  shell('pending', 'بانتظار التوقيع', body, `<button class="btn pri" data-act="newAny">${icon('plus')} مستند جديد</button>`);
  bindActs({
    newAny: () => chooseTypeModal(),
    f: el => { ui.t = el.dataset.f; $$('.chip').forEach(c => c.classList.toggle('on', c === el)); $('#rows').innerHTML = rowsHTML(); },
    copy: el => { const d = S.docs.find(x => x.id === el.dataset.id); if(d) copyText(signLink(d), 'تم نسخ رابط التوقيع'); },
    send: async el => { const d = S.docs.find(x => x.id === el.dataset.id); if(!d) return; const sg = await fetchSigs(d.id); openSendModal(d, sg); }
  });
  app.oninput = e => { if(e.target.id === 'q'){ ui.q = e.target.value.trim(); $('#rows').innerHTML = rowsHTML(); } };
}

/* =================== سجل التوقيعات =================== */
async function renderLog(){
  await statsForPage(renderLog);
  const ui = { tab: 'docs', t: 'all', s: 'all', q: '', sigs: null };
  const pub = () => S.docs.filter(d => d.status !== 'draft');
  const docsHTML = () => {
    let l = pub();
    if(ui.t !== 'all') l = l.filter(d => d.doc_type === ui.t);
    if(ui.s === 'done') l = l.filter(d => (S.stats[d.id] || 0) >= docEligibleCount(d));
    else if(ui.s === 'part') l = l.filter(d => (S.stats[d.id] || 0) < docEligibleCount(d));
    else if(ui.s === 'closed') l = l.filter(d => d.status === 'closed');
    if(ui.q) l = l.filter(d => (d.title + ' ' + (d.ref_no || '') + ' ' + typeLabel(d)).includes(ui.q));
    if(!l.length) return `<div class="card empty">${icon('archive', 40)}<p>لا توجد مستندات منشورة ${ui.q || ui.t !== 'all' || ui.s !== 'all' ? 'مطابقة' : 'بعد'}.</p></div>`;
    return `<div class="tbl-w"><table class="tbl"><thead><tr><th>العنوان</th><th>النوع</th><th>الرقم</th><th>التاريخ</th><th>الحالة</th><th>التوقيعات</th><th></th></tr></thead><tbody>
      ${l.map(d => { const a = S.stats[d.id] || 0, b = docEligibleCount(d); return `<tr><td><a class="tl" href="#/d/${d.id}">${esc(d.title || 'بدون عنوان')}</a></td><td>${esc(typeLabel(d))}</td><td>${esc(d.ref_no || '—')}</td><td>${fmtDate(d.doc_date)}</td>
        <td><span class="bdg ${d.status}">${stLabel(d.status)}</span>${a >= b && b ? ' <span class="bdg active">مكتمل</span>' : ''}</td><td>${progCell(d)}</td>
        <td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="plog" data-id="${d.id}">${icon('printer', 14)} السجل</button><a class="btn sm" href="#/d/${d.id}">فتح</a></div></td></tr>`; }).join('')}
    </tbody></table></div>`;
  };
  const sigsHTML = () => {
    if(!ui.sigs) return `<div class="card empty">جاري التحميل…</div>`;
    const dm = new Map(S.docs.map(d => [d.id, d]));
    let l = ui.sigs.filter(s => dm.has(s.document_id));
    if(ui.t !== 'all') l = l.filter(s => dm.get(s.document_id).doc_type === ui.t);
    if(ui.q) l = l.filter(s => (s.signer_name + ' ' + s.signer_national_id + ' ' + dm.get(s.document_id).title).includes(ui.q));
    if(!l.length) return `<div class="card empty">لا توجد توقيعات ${ui.q || ui.t !== 'all' ? 'مطابقة' : 'بعد'}.</div>`;
    return `<p class="hint">آخر ${l.length} توقيع (الأحدث أولاً)</p><div class="tbl-w"><table class="tbl"><thead><tr><th>م</th><th>الموظفة</th><th>السجل المدني</th><th>المستند</th><th>النوع</th><th>تاريخ ووقت التوقيع</th><th>التوقيع</th></tr></thead><tbody>
      ${l.map((s, i) => { const d = dm.get(s.document_id); return `<tr><td>${i + 1}</td><td><b>${esc(s.signer_name)}</b></td><td>${esc(s.signer_national_id)}</td><td><a class="tl" href="#/d/${d.id}">${esc(d.title || 'بدون عنوان')}</a></td><td>${esc(typeLabel(d))}</td><td>${fmtDT(s.signed_at)}</td><td>${s.signature_image ? `<img src="${s.signature_image}" alt="" style="height:26px;max-width:80px;object-fit:contain">` : icon('check', 16)}</td></tr>`; }).join('')}
    </tbody></table></div>`;
  };
  const view = () => ui.tab === 'docs' ? docsHTML() : sigsHTML();
  const p = pub(); let A = 0, B = 0; p.forEach(d => { A += S.stats[d.id] || 0; B += docEligibleCount(d); });
  const done = p.filter(d => (S.stats[d.id] || 0) >= docEligibleCount(d) && docEligibleCount(d)).length;
  const usedTypes = [...new Set(p.map(d => d.doc_type))];
  const body = `<div class="sumrow"><div><b>${p.length}</b><span>مستند منشور</span></div><div><b>${done}</b><span>مكتمل التوقيع</span></div><div><b>${A}</b><span>توقيع مسجّل</span></div><div><b>${pct(A, B)}%</b><span>نسبة الاعتماد</span></div></div>
    <div class="tabs"><button class="tab on" data-act="tab" data-t="docs">سجل المستندات</button><button class="tab" data-act="tab" data-t="sigs">سجل كل التوقيعات</button></div>
    <div class="toolbar"><input class="in" id="q" placeholder="بحث بالعنوان أو اسم الموظفة أو السجل">

function parseRows(arrs){
  arrs = arrs.map(r => (r || []).map(c => String(c ?? '').trim())).filter(r => r.some(c => c));
  if(!arrs.length) return [];
  let map = null, start = 0;
  for(let i = 0; i < Math.min(5, arrs.length); i++){
    const r = arrs[i];
    const idx = k => r.findIndex(c => k.some(w => c.includes(w)));
    const n = idx(['اسم']), d = idx(['سجل','هوية','الهوية','المدني','إقامة']);
    if(n > -1 && d > -1){ map = { n, d, j: idx(['وظيف','مسمى','العمل','عمل']), p: idx(['جوال','هاتف','موبايل','تواصل']) }; start = i + 1; break; }
  }
  return arrs.slice(start).map(r => {
    let name = '', nid = '', job = '', phone = '';
    if(map){ name = r[map.n] || ''; nid = r[map.d] || ''; job = map.j > -1 ? r[map.j] || '' : ''; phone = map.p > -1 ? r[map.p] || '' : ''; }
    else {
      const texts = [];
      r.forEach(c => { const dg = onlyDigits(c); if(dg.length === 10 && /^[12]/.test(dg) && !nid) nid = dg; else if(/^(05|5|9665|\+9665)/.test(dg) && dg.length >= 9 && !phone) phone = dg; else if(c && !/^\d+$/.test(digits(c))) texts.push(c); });
      name = texts[0] || ''; job = texts[1] || '';
    }
    nid = onlyDigits(nid); phone = phoneNorm(phone);
    let err = '';
    if(!name) err = 'الاسم مفقود'; else if(nid.length !== 10) err = 'السجل المدني غير صحيح'; else if(phone && !/^05\d{8}$/.test(phone)) err = 'رقم الجوال غير صحيح';
    return { name: name.trim(), national_id: nid, job_title: job.trim(), phone, err };
  });
}

    }
    m.remove(); toast(`تم استيراد ${payload.length} موظفة`, 'ok'); onDone();
  };
}

    const { error: e2 } = await sb.rpc('imdaa_save_school_settings', { p_settings: st });
    if(e2) return toast(errMsg(e2), 'err');
    if(old) sb.storage.from(BUCKET).remove([old]);
    toast(logoColor ? 'تم حفظ الشعار وتعديل ألوان منصة المدرسة لتطابقه' : 'تم حفظ الشعار', 'ok'); renderSettings();
  };
  bindActs({
    logo: () => $('#lf').click(),
    fromLogo: async () => { const c = await colorFromImage(st.logo_url); if(!c) return toast('تعذر استخراج لون واضح من الشعار — اختاري اللون يدوياً', 'err'); setTheme(c, 'تمت مطابقة الألوان مع الشعار'); },
    resetTheme: () => setTheme(null, 'تمت إعادة الألوان الافتراضية'),
    rmLogo: async () => {
      const old = st.logo_path; delete st.logo_url; delete st.logo_path;
      await sb.rpc('imdaa_save_school_settings', { p_settings: st }); if(old) sb.storage.from(BUCKET).remove([old]); renderSettings();
    },
    pw: async () => {
      const a = $('#np').value, b = $('#np2').value;
      if(a.length < 8) return toast('كلمة المرور 8 أحرف على الأقل', 'err');
      if(a !== b) return toast('كلمتا المرور غير متطابقتين', 'err');
      const { error } = await sb.auth.updateUser({ password: a });
      if(error) return toast(errMsg(error), 'err');
      $('#np').value = $('#np2').value = ''; toast('تم تحديث كلمة المرور', 'ok');
    }
  });
}

/* =================== لوحة المالك =================== */
async function renderOwner(){
  applyTheme(null);
  stopRefresh(); app.onclick = null; app.oninput = null; app.onchange = null;
  document.title = PLATFORM_NAME + ' — لوحة المالك';
  app.innerHTML = `<div class="empty">جاري التحميل…</div>`;
  const { data, error } = await sb.rpc('imdaa_owner_schools');
  if(error){ app.innerHTML = `<div class="center-card"><div class="card">${esc(errMsg(error))}</div></div>`; return; }
  const list = data || []; const ui = { f: 'all', q: '' };
  const sum = k => list.reduce((a, s) => a + Number(s[k] || 0), 0);
  const rowsHTML = () => {
    let l = ui.f === 'all' ? list : list.filter(s => s.status === ui.f);
    if(ui.q) l = l.filter(s => (s.name + ' ' + s.ministry_no + ' ' + (s.admin_name || '') + ' ' + (s.admin_national_id || '')).includes(ui.q));
    if(!l.length) return `<div class="card empty">لا توجد مدارس ${ui.f === 'all' && !ui.q ? 'مسجلة بعد' : 'مطابقة'}.</div>`;
    return `<div class="tbl-w"><table class="tbl"><thead><tr><th>المدرسة</th><th>الرقم الوزاري</th><th>مديرة النظام</th><th>التسجيل</th><th>موظفات / مستندات / توقيعات</th><th>الحالة</th><th></th></tr></thead><tbody>
    ${l.map(s => `<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.ministry_no)}</td><td>${esc(s.admin_name || '')}<br><small class="mut">${esc(s.admin_national_id || '')}</small></td><td>${fmtDate(s.created_at)}</td><td>${s.emp_count} / ${s.doc_count} / ${s.sig_count}</td>
      <td><span class="bdg ${s.status}">${{active:'مفعّلة', pending:'بانتظار التفعيل', suspended:'موقوفة'}[s.status] || s.status}</span></td>
      <td><div class="row" style="flex-wrap:nowrap">${s.status !== 'active' ? `<button class="btn sm ok" data-act="st" data-id="${s.id}" data-s="active">${icon('check', 14)} تفعيل</button>` : `<button class="btn sm" data-act="st" data-id="${s.id}" data-s="suspended">إيقاف</button>`}<button class="btn sm" data-act="pw" data-id="${s.id}" title="إعادة تعيين كلمة المرور">${icon('key', 14)}</button><button class="btn sm dg" data-act="del" data-id="${s.id}" title="حذف">${icon('trash', 14)}</button></div></td></tr>`).join('')}
    </tbody></table></div>`;
  };
  const cnt = k => k === 'all' ? list.length : list.filter(s => s.status === k).length;
  app.innerHTML = `<div class="main" style="min-height:100vh"><header class="top"><div class="brand" style="border:0;margin:0;padding:0"><div class="lg">${icon('shield', 22)}</div><div><b>${PLATFORM_NAME} — لوحة مالك المنصة</b><small>المستخدم: ${esc(String(S.user.email || '').replace(/^owner\./, '').split('@')[0])}</small></div></div><div class="acts"><button class="btn" id="rf">${icon('refresh')} تحديث</button><button class="btn" id="lo">${icon('logout')} خروج</button></div></header>
    <div class="content" style="margin:0 auto">
    <div class="kpis">
      <div class="kpi"><div class="ico">${icon('school', 22)}</div><div><b>${list.length}</b><span>مدرسة مسجلة</span></div></div>
      <div class="kpi"><div class="ico">${icon('check', 22)}</div><div><b>${cnt('active')}</b><span>مفعّلة</span></div></div>
      <div class="kpi"><div class="ico" style="background:var(--wr-l);color:var(--wr)">${icon('clock', 22)}</div><div><b>${cnt('pending')}</b><span>بانتظار التفعيل</span></div></div>
      <div class="kpi"><div class="ico">${icon('users', 22)}</div><div><b>${sum('emp_count')}</b><span>موظفة</span></div></div>
      <div class="kpi"><div class="ico">${icon('file', 22)}</div><div><b>${sum('doc_count')}</b><span>مستند</span></div></div>
      <div class="kpi"><div class="ico">${icon('edit', 22)}</div><div><b>${sum('sig_count')}</b><span>توقيع</span></div></div>
    </div>
    <div class="toolbar"><input class="in" id="q" placeholder="بحث بالاسم أو الرقم الوزاري أو البريد"><div class="chips">${[['all','الكل'],['pending','بانتظار التفعيل'],['active','مفعّلة'],['suspended','موقوفة']].map(([k, l]) => `<button class="chip ${k === 'all' ? 'on' : ''}" data-act="f" data-f="${k}">${l} (${cnt(k)})</button>`).join('')}</div></div>
    <div id="rows">${rowsHTML()}</div></div></div>`;
  $('#lo').onclick = logout; $('#rf').onclick = renderOwner;
  bindActs({
    f: el => { ui.f = el.dataset.f; $$('.chip').forEach(c => c.classList.toggle('on', c === el)); $('#rows').innerHTML = rowsHTML(); },
    st: async el => {
      const { error } = await sb.rpc('imdaa_owner_set_status', { p_id: el.dataset.id, p_status: el.dataset.s });
      if(error) return toast(errMsg(error), 'err'); toast(el.dataset.s === 'active' ? 'تم تفعيل المدرسة' : 'تم إيقاف المدرسة', 'ok'); renderOwner();
    },
    del: async el => {
      const s = list.find(x => x.id === el.dataset.id);
      if(!await confirmBox(`حذف مدرسة «${esc(s.name)}» نهائياً مع جميع موظفاتها ومستنداتها وتوقيعاتها؟ لا يمكن التراجع.`, 'حذف نهائي', true)) return;
      const { error } = await sb.rpc('imdaa_owner_delete_school', { p_id: s.id });
      if(error) return toast(errMsg(error), 'err'); toast('تم حذف المدرسة', 'ok'); renderOwner();
    },
    pw: el => {
      const s = list.find(x => x.id === el.dataset.id);
      const m = modal(`<h3>${icon('key')} إعادة تعيين كلمة مرور «${esc(s.name)}»</h3><p class="mut" style="margin-top:0">الرقم الوزاري للدخول: <b>${esc(s.ministry_no)}</b></p>
        <div class="fld"><label class="lb">كلمة المرور الجديدة</label><input class="in" id="rp" type="text" autocomplete="off" style="direction:ltr"></div><div class="err" id="re"></div>
        <div class="acts"><button class="btn pri" id="rok">حفظ</button><button class="btn" id="rx">إلغاء</button></div>`);
      m.querySelector('#rx').onclick = () => m.remove();
      m.querySelector('#rok').onclick = async () => {
        const p = m.querySelector('#rp').value;
        if(p.length < 8) return m.querySelector('#re').textContent = 'كلمة المرور 8 أحرف على الأقل';
        const { error } = await sb.rpc('imdaa_owner_reset_password', { p_id: s.id, p_new: p });
        if(error) return m.querySelector('#re').textContent = errMsg(error);
        m.remove(); toast('تم تحديث كلمة المرور — أبلغي المدرسة بها', 'ok');
      };
    }
  });
  app.oninput = e => { if(e.target.id === 'q'){ ui.q = e.target.value.trim(); $('#rows').innerHTML = rowsHTML(); } };
}

/* =================== التوجيه =================== */
async function route(){
  if(S.flush){ const f = S.flush; S.flush = null; f(); }
  stopRefresh();
  $('#modalRoot').innerHTML = '';
  document.body.classList.remove('printing');
  const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  if(parts[0] === 'sign' && parts[1]) return renderSign(parts[1]);
  if(!S.user && !S.checked){
    S.checked = true;
    const { data: { session } } = await sb.auth.getSession();
    if(session){ try{ await loadAccount(session.user); }catch(e){ S.user = null; } }
  }
  if(!S.user) return parts[0] ? renderAuth(parts[0]) : renderLanding();
  if(S.role === 'owner') return renderOwner();
  if(S.role !== 'school') return renderStatusPage();
  window.scrollTo(0, 0);
  switch(parts[0]){
    case 't': return renderTypeList(parts[1]);
    case 'd': return renderDoc(parts[1]);
    case 'pending': return renderPending();
    case 'log': return renderLog();
    case 'emp': return renderEmployees();
    case 'settings': return renderSettings();
    default: return renderDashboard();
  }
}
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', () => { if(S.flush) S.flush(); });

async function init(){
  if(window.DEMO_MODE){ sb = createDemoClient(); if(window.demoBoot) demoBoot(); }
  else if(!CONFIGURED || !window.supabase){
    app.innerHTML = `<div class="center-card"><div class="card c" style="padding:30px">${icon('shield', 44)}<h2>${PLATFORM_NAME}</h2><p class="mut">${!window.supabase ? 'تعذر تحميل مكتبة الاتصال. تحققي من الإنترنت.' : 'لم يُضبط الاتصال بقاعدة البيانات بعد.'}</p></div></div>`;
    return;
  }
  else sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  if(!location.hash.startsWith('#/sign/')){
    app.innerHTML = `<div class="empty" style="padding-top:30vh">جاري التحميل…</div>`;
    S.checked = true;
    const { data: { session } } = await sb.auth.getSession();
    if(session){ try{ await loadAccount(session.user); }catch(e){ S.user = null; } }
  }
  route();
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
